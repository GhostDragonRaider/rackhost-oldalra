# AntiCode SEO-ready nginx (apply on VPS later — do not use until go-live)
# Canonical host: https://anticode.hu
# - HTTP + IP → 301 apex HTTPS
# - www HTTPS → 301 apex HTTPS
# - apex HTTPS → Next.js on 127.0.0.1:3000

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name anticode.hu www.anticode.hu 217.13.105.235 _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://anticode.hu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.anticode.hu 217.13.105.235;

    ssl_certificate /etc/letsencrypt/live/anticode.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anticode.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://anticode.hu$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name anticode.hu;

    ssl_certificate /etc/letsencrypt/live/anticode.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anticode.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
